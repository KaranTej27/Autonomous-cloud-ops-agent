# Local stack. Today it runs the dashboard prototype only; backend, PostgreSQL,
# Prometheus, and Grafana join as their milestones land (see README.md here).
#
#   docker compose -f deploy/docker/compose.yaml up --build
#   open http://localhost:8080

name: cloudops-soc

services:
  dashboard:
    build:
      context: ../../dashboard
    image: cloudops-soc-dashboard:0.1.0
    ports:
      # Bound to loopback so the lab console is not exposed on the network.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
